# Base de datos local para desarrollo: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: contable
      POSTGRES_PASSWORD: contable
      POSTGRES_DB: contable
    ports: ['5432:5432']
    volumes: ['dbdata:/var/lib/postgresql/data', './docs/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro']
volumes:
  dbdata:
